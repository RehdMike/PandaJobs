services:
  - type: web
    name: pandajobs
    runtime: image
    image:
      # Replace with your Docker Hub username before creating the Render service.
      url: docker.io/rehdmike/pandajobs:latest
    plan: starter
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "pandajobs.onrender.com"
